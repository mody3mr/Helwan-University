<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - امتحان المهارة التفاعلي الآمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 30px auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0; }
        
        .quiz-header { background: #0f172a; color: white; padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .quiz-header h2 { font-size: 22px; font-weight: 700; }
        .timer-box { background: #ef4444; color: white; padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }

        .quiz-body { padding: 30px; }
        .question-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .question-card h3 { font-size: 16px; color: #0f172a; margin-bottom: 15px; font-weight: 700; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item { display: flex; align-items: center; gap: 10px; background: white; padding: 12px 16px; border-radius: 10px; border: 1px solid #cbd5e1; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .option-item:hover { border-color: #3b82f6; background: #eff6ff; }
        .option-item input { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; }

        .btn-submit-quiz { background: #22c55e; color: white; border: none; padding: 14px 25px; font-size: 16px; font-weight: 700; border-radius: 12px; width: 100%; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-submit-quiz:hover { background: #16a34a; }

        .result-box { text-align: center; padding: 40px 20px; display: none; }
        .result-box h1 { font-size: 32px; color: #0f172a; margin-bottom: 15px; }
        .result-score { font-size: 48px; font-weight: 700; color: #2563eb; margin-bottom: 20px; }
        .btn-back { background: #2563eb; color: white; padding: 10px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block; }
        .no-data { text-align: center; color: #94a3b8; padding: 40px; font-size: 16px; }

        /* نافذة التنبيه الاحترافية (Custom Professional Modal) */
        #customAlertOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 99999; padding: 20px;
        }
        .custom-alert-box {
            background: white; width: 100%; max-width: 450px; border-radius: 20px;
            padding: 30px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: modalScale 0.3s ease;
        }
        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-alert-icon { font-size: 42px; margin-bottom: 15px; }
        .custom-alert-title { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 10px; }
        .custom-alert-msg { font-size: 14.5px; color: #475569; margin-bottom: 25px; line-height: 1.6; }
        .custom-alert-btn {
            background: #2563eb; color: white; border: none; padding: 12px 30px;
            border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; width: 100%;
        }
        .custom-alert-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <!-- نافذة التنبيه الاحترافية بدلاً من رسائل المتصفح القديمة -->
    <div id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-icon" id="alertIcon">⚠️</div>
            <div class="custom-alert-title" id="alertTitle">تنبيه هام</div>
            <div class="custom-alert-msg" id="alertMessage">رسالة التنبيه هنا...</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">حسناً، فهمت</button>
        </div>
    </div>

    <div class="container" id="quizContainer">
        <div class="quiz-header">
            <h2 id="quizTitle">جاري تحميل الامتحان الآمن...</h2>
            <div class="timer-box" id="timerBox">⏳ الوقت باقي: --:--</div>
        </div>

        <div class="quiz-body" id="quizBody">
            <div class="no-data">جاري التحقق من الصلاحيات وجلب الأسئلة...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, addDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        let quizData = null;
        let timerInterval = null;
        let examSubmitted = false;
        let currentStudent = null;
        let existingResultDocId = null;
        let alertCallback = null;

        // دالة إظهار التنبيه الاحترافي
        window.showAlert = function(title, message, icon = '⚠️', callback = null) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertIcon').innerText = icon;
            document.getElementById('customAlertOverlay').style.display = 'flex';
            alertCallback = callback;
        }

        window.closeCustomAlert = function() {
            document.getElementById('customAlertOverlay').style.display = 'none';
            if (typeof alertCallback === 'function') {
                alertCallback();
                alertCallback = null;
            }
        }

        const studentStr = localStorage.getItem('currentStudent');
        if (!studentStr) {
            showAlert('خطأ في تسجيل الدخول', 'يرجى تسجيل الدخول أولاً!', '❌', () => { location.href = 'index.html'; });
        } else {
            currentStudent = JSON.parse(studentStr);
        }

        if (!quizId) {
            showAlert('خطأ', 'لم يتم تحديد الامتحان!', '❌', () => { window.history.back(); });
        } else {
            checkAndLoadQuiz(quizId);
        }

        async function checkAndLoadQuiz(id) {
            try {
                const studentIdKey = currentStudent.student_id || currentStudent.email || 'unknown_student';
                
                const resultsQuery = query(
                    collection(db, "quizResults"),
                    where("quizId", "==", id),
                    where("studentId", "==", studentIdKey)
                );
                const resultsSnap = await getDocs(resultsQuery);

                let hasActiveRetake = false;
                resultsSnap.forEach(docSnap => {
                    const resData = docSnap.data();
                    existingResultDocId = docSnap.id;
                    if (resData.canRetake === true) {
                        hasActiveRetake = true;
                    }
                });

                if (!resultsSnap.empty && !hasActiveRetake) {
                    showBlockedScreen("لقد قمت بأداء هذا الامتحان مسبقاً! محاولتك انتهت ولا يمكنك إعادته إلا بعد موافقة الإدارة من لوحة التحكم.");
                    return;
                }

                const docSnap = await getDoc(doc(db, "materialContents", id));
                if (!docSnap.exists()) {
                    document.getElementById('quizBody').innerHTML = `<div class="no-data" style="color:red;">عذراً، هذا الامتحان غير موجود.</div>`;
                    return;
                }

                quizData = docSnap.data();
                document.getElementById('quizTitle').innerText = quizData.title;

                if (!quizData.questions || quizData.questions.length === 0) {
                    document.getElementById('quizBody').innerHTML = `<div class="no-data">لم يتم إدراج أسئلة لهذا الامتحان بعد.</div>`;
                    return;
                }

                renderQuestions(quizData.questions);
                startTimer(quizData.durationMinutes || 15);
                initSecurityShield();

            } catch (e) {
                console.error(e);
                document.getElementById('quizBody').innerHTML = `<div class="no-data" style="color:red;">حدث خطأ أثناء تحميل الامتحان.</div>`;
            }
        }

        function renderQuestions(questions) {
            let html = '';
            questions.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option-item">
                            <input type="radio" name="question_${qIndex}" value="${optIndex}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                html += `
                    <div class="question-card" data-qindex="${qIndex}">
                        <h3>السؤال ${qIndex + 1}: ${q.questionText}</h3>
                        <div class="options-list">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });

            html += `<button class="btn-submit-quiz" onclick="submitQuiz()">تسليم الامتحان وإنهاء</button>`;
            document.getElementById('quizBody').innerHTML = html;
        }

        function startTimer(durationMinutes) {
            let totalSeconds = durationMinutes * 60;
            const timerBox = document.getElementById('timerBox');

            timerInterval = setInterval(() => {
                let minutes = Math.floor(totalSeconds / 60);
                let seconds = totalSeconds % 60;

                timerBox.innerText = `⏳ الوقت باقي: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    showAlert('انهاء الوقت', 'انتهى الوقت المخصص للامتحان!', '⏰', () => { submitQuiz(true); });
                }
                totalSeconds--;
            }, 1000);
        }

        function initSecurityShield() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && !examSubmitted) {
                    triggerZeroScoreViolation("تم رصد محاولة مغادرة صفحة الامتحان!");
                }
            });

            window.addEventListener('blur', () => {
                if (!examSubmitted) {
                    triggerZeroScoreViolation("تم رصد محاولة مغادرة صفحة الامتحان!");
                }
            });
        }

        async function triggerZeroScoreViolation(reason) {
            if (examSubmitted) return;
            examSubmitted = true;
            if (timerInterval) clearInterval(timerInterval);

            await saveQuizResultToDB(0, quizData.questions.length, 0);
            showAlert('تحذير أمني أصفر', `${reason}\nتم اعتبار امتحانك منتهياً وتسجيله (صفر).`, '🚫', () => {
                showBlockedScreen("تم رصد محاولة مغادرة للصفحة. تم تسليم درجتك (صفر).");
            });
        }

        window.submitQuiz = async function(isTimeout = false) {
            if (examSubmitted) return;
            examSubmitted = true;
            if (timerInterval) clearInterval(timerInterval);

            let score = 0;
            const questions = quizData.questions;

            questions.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                if (selected && parseInt(selected.value) === q.correctOptionIndex) {
                    score++;
                }
            });

            const percentage = Math.round((score / questions.length) * 100);
            await saveQuizResultToDB(score, questions.length, percentage);

            const container = document.getElementById('quizContainer');
            container.innerHTML = `
                <div class="result-box" style="display: block;">
                    <h1>🎉 تم تسليم الامتحان بنجاح!</h1>
                    <p style="color:#64748b; font-size:16px; margin-bottom:10px;">نتيجة تقييم المهارة الخاصة بك:</p>
                    <div class="result-score">${score} / ${questions.length} (${percentage}%)</div>
                    <p style="color:#334155; font-size:15px; margin-bottom:25px;">${percentage >= 50 ? 'أداء ممتاز، استمر في التميز!' : 'تحتاج لمراجعة المادة ومحاولة التدريب مرة أخرى.'}</p>
                    <a href="javascript:window.history.back();" class="btn-back">العودة لصفحة المادة</a>
                </div>
            `;
        }

        async function saveQuizResultToDB(score, total, percentage) {
            try {
                const studentName = currentStudent.fullName || currentStudent.name || 'طالب مجهول';
                const studentId = currentStudent.student_id || currentStudent.email || 'غير معروف';

                const resultPayload = {
                    quizId: quizId,
                    quizTitle: quizData.title,
                    materialTitle: quizData.materialTitle || 'مادة دراسية',
                    targetRole: quizData.targetRole || 'professor',
                    studentId: studentId,
                    studentName: studentName,
                    score: score,
                    total: total,
                    percentage: percentage,
                    canRetake: false,
                    attemptNumber: existingResultDocId ? 2 : 1,
                    createdAt: new Date().toISOString()
                };

                if (existingResultDocId) {
                    await updateDoc(doc(db, "quizResults", existingResultDocId), resultPayload);
                } else {
                    await addDoc(collection(db, "quizResults"), resultPayload);
                }
            } catch(e) {
                console.error("Error saving result to DB:", e);
            }
        }

        function showBlockedScreen(message) {
            const container = document.getElementById('quizContainer');
            container.innerHTML = `
                <div class="result-box" style="display: block;">
                    <h1 style="color:#ef4444;">🚫 تنبيه هام</h1>
                    <p style="color:#334155; font-size:16px; margin-bottom:25px;">${message}</p>
                    <a href="javascript:window.history.back();" class="btn-back">العودة للمادة</a>
                </div>
            `;
        }
    </script>

</body>
</html>
