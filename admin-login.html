<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - تسجيل دخول الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #334155; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        #toast-container { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { padding: 16px 20px; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(-20px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #ef4444; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="login-card">
        <h2>تسجيل دخول الإدارة</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">البريد الإلكتروني أو اسم المسؤول</label>
                <input type="text" id="adminEmail" placeholder="أدخل البريد أو الاسم" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">كلمة المرور</label>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-submit">دخول لوحة التحكم</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('adminEmail').value.trim();
            const passwordVal = document.getElementById('adminPassword').value.trim();

            try {
                // 1. السوبر أدمن الخاص بك (محمد عمرو)
                if ((inputVal === "Mohamed Amr" || inputVal === "mody3mr" || inputVal === "admin@helwan.edu.eg") && passwordVal === "mody2026") {
                    sessionStorage.setItem('currentAdminName', "محمد عمرو (سوبر أدمن)");
                    sessionStorage.setItem('currentAdminRole', "super_admin");
                    sessionStorage.setItem('adminPermissions', JSON.stringify(['materials_manage', 'materials_delete', 'sections_manage', 'sections_delete', 'files_manage', 'files_delete', 'notifs_manage', 'notifs_delete', 'students_manage', 'students_delete']));
                    showToast('أهلاً بك يا باشمهندس محمد عمرو، جاري التوجيه...', 'success');
                    setTimeout(() => { location.href = 'admin.html'; }, 1000);
                    return;
                }

                // 2. التحقق من قاعدة البيانات للمديرين والمشرفين
                const qEmail = query(collection(db, "admins"), where("email", "==", inputVal), where("password", "==", passwordVal));
                const qName = query(collection(db, "admins"), where("name", "==", inputVal), where("password", "==", passwordVal));

                const [snapEmail, snapName] = await Promise.all([getDocs(qEmail), getDocs(qName)]);
                let adminDoc = null;

                if (!snapEmail.empty) adminDoc = snapEmail.docs[0].data();
                else if (!snapName.empty) adminDoc = snapName.docs[0].data();

                if (adminDoc) {
                    if (adminDoc.status === 'suspended') {
                        showToast('عذراً، هذا الحساب موقوف من قبل الإدارة.', 'error');
                        return;
                    }

                    sessionStorage.setItem('currentAdminName', adminDoc.name);
                    sessionStorage.setItem('currentAdminRole', adminDoc.role);
                    sessionStorage.setItem('adminPermissions', JSON.stringify(adminDoc.permissions || []));
                    
                    showToast('تم تسجيل الدخول بنجاح، مرحباً ' + adminDoc.name, 'success');
                    setTimeout(() => { location.href = 'admin.html'; }, 1000);
                } else {
                    showToast('بيانات الدخول غير صحيحة أو الحساب غير موجود!', 'error');
                }

            } catch (err) {
                console.error(err);
                showToast('حدث خطأ أثناء الاتصال بقاعدة البيانات', 'error');
            }
        });
    </script>
</body>
</html>
