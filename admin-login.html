<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - تسجيل دخول الإدارة الآمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #334155; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        #toast-container { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { padding: 16px 20px; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(-20px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #ef4444; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="login-card">
        <h2>تسجيل دخول الإدارة</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">البريد الإلكتروني للإدارة</label>
                <input type="email" id="adminEmail" placeholder="admin@helwan.edu.eg" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">كلمة المرور</label>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">دخول لوحة التحكم</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailVal = document.getElementById('adminEmail').value.trim();
            const passwordVal = document.getElementById('adminPassword').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري التحقق والأمان...";

            try {
                // 1. الفحص الصارم من Firebase Auth (لو الحساب معطل أو محذوف يتوقف فوراً)
                let user = null;
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, emailVal, passwordVal);
                    user = userCredential.user;
                } catch (authError) {
                    console.error("Auth error:", authError);
                    let msg = 'بيانات الدخول غير صحيحة أو الحساب غير موجود!';
                    if (authError.code === 'auth/user-disabled') {
                        msg = 'عذراً، هذا الحساب معطل من قبل إدارة Firebase!';
                    } else if (authError.code === 'auth/invalid-credential' || authError.code === 'auth/user-not-found' || authError.code === 'auth/wrong-password') {
                        msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة!';
                    } else if (authError.code === 'auth/too-many-requests') {
                        msg = 'تم حظر المحاولات مؤقتاً بسبب التكرار الخاطئ. حاول لاحقاً.';
                    }
                    showToast(msg, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول لوحة التحكم";
                    return; // ⛔ خروج فوراً وعدم الانتقال لفحص قاعدة البيانات
                }

                // 2. التحقق من وجود بيانات الأدمن وصلاحياته في Firestore
                let adminDocData = null;
                
                // البحث باستخدام UID المستند أولاً
                const docRef = doc(db, "admins", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    adminDocData = docSnap.data();
                } else {
                    // البحث بالبريد الإلكتروني كبديل
                    const qEmail = query(collection(db, "admins"), where("email", "==", emailVal));
                    const snapEmail = await getDocs(qEmail);
                    if (!snapEmail.empty) {
                        adminDocData = snapEmail.docs[0].data();
                    }
                }

                // لو الحساب غير موجود في الكولكشن أو معطل من Firestore
                if (!adminDocData) {
                    showToast('تم التحقق ولكن حسابك غير مسجل كعضو إداري في النظام!', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول لوحة التحكم";
                    return;
                }

                if (adminDocData.status === 'suspended' || adminDocData.status === 'inactive') {
                    showToast('عذراً، هذا الحساب الإداري موقوف حالياً من قاعدة البيانات.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول لوحة التحكم";
                    return;
                }

                // 3. تخزين الجلسة وتوجيه الأدمن للداش بورد
                sessionStorage.setItem('currentAdminName', adminDocData.name || 'عضو إداري');
                sessionStorage.setItem('currentAdminRole', adminDocData.role || 'manager');
                sessionStorage.setItem('adminPermissions', JSON.stringify(adminDocData.permissions || []));
                
                showToast('تم تسجيل الدخول بنجاح، مرحباً ' + (adminDocData.name || ''), 'success');
                setTimeout(() => { location.href = 'admin.html'; }, 1000);

            } catch (err) {
                console.error("System error:", err);
                showToast('حدث خطأ أثناء الاتصال بالنظام', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = "دخول لوحة التحكم";
            }
        });
    </script>
</body>
</html>
