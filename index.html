<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - البوابة الطلابية</title>
    <!-- استدعاء خط Cairo الشيك -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #2980b9;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
        .switch-text span {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .switch-text span:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }

        /* تصميم الـ Toast Messages الاحترافية */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success { background-color: #2ecc71; }
        .toast.error { background-color: #e74c3c; }
        .toast.warning { background-color: #f39c12; }
    </style>
</head>
<body>

    <!-- حاوية الـ Toast Messages -->
    <div id="toast-container"></div>

    <div class="card-container">
        
        <!-- قسم تسجيل الدخول -->
        <div id="loginSection">
            <h2>تسجيل الدخول - جامعة حلوان</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn-submit">دخول</button>
                <div class="switch-text">
                    ليس لديك حساب؟ <span onclick="switchForm('register')">انشئ حساب جديد</span>
                </div>
            </form>
        </div>

        <!-- قسم إنشاء الحساب (مخفي افتراضياً) -->
        <div id="registerSection" class="hidden">
            <h2>تسجيل طالب جديد</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">الاسم الرباعي</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الرباعي" required>
                </div>
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="أدخل رقم هاتفك المحمول" required>
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة مرور قوية" required>
                </div>
                <div class="form-group">
                    <label for="academicYear">السنة الدراسية</label>
                    <select id="academicYear" required>
                        <option value="" disabled selected>اختر الفرقة الدراسية...</option>
                        <option value="1">الفرقة الأولى</option>
                        <option value="2">الفرقة الثانية</option>
                        <option value="3">الفرقة الثالثة</option>
                        <option value="4">الفرقة الرابعة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nationalId">رقم البطاقة (القومي)</label>
                    <input type="text" id="nationalId" placeholder="أدخل رقم البطاقة المكون من 14 رقماً" maxlength="14" required>
                </div>
                <button type="submit" class="btn-submit">تسجيل الحساب</button>
                <div class="switch-text">
                    لديك حساب بالفعل؟ <span onclick="switchForm('login')">تسجيل الدخول</span>
                </div>
            </form>
        </div>

    </div>

    <script>
        // دالة إظهار الـ Toast Messages الاحترافية
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            
            // تفعيل تأثير الظهور
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);

            // إخفاء وحذف الـ Toast بعد 4 ثواني
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 4000);
        }

        // دالة التنقل بين واجهة تسجيل الدخول وإنشاء الحساب
        function switchForm(target) {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            
            if(target === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
            }
        }

        // محاكاة إرسال فورم التسجيل (لحد ما نربط Firebase ونتحقق من عدم التكرار)
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nationalId = document.getElementById('nationalId').value;
            const phone = document.getElementById('phone').value;

            // التحقق المبدئي (هيتوسع لما نربط بـ Firebase لمنع التكرار)
            if(nationalId.length !== 14) {
                showToast('رقم البطاقة يجب أن يكون 14 رقماً صحيحاً!', 'error');
                return;
            }

            // مثال لرسالة نجاح احترافية
            showToast('تم استلام طلبك بنجاح! حسابك في انتظار موافقة الإدارة.', 'success');
            
            // بعد ثواني ممكن ننقله لتسجيل الدخول
            setTimeout(() => {
                switchForm('login');
            }, 2500);
        });

        // محاكاة تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showToast('جاري التحقق من بيانات الدخول...', 'warning');
        });
    </script>

</body>
</html>
