<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - إنشاء حساب طالب جديد</title>
    <!-- استدعاء خط Cairo الشيك -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .register-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #2980b9;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
        .login-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>تسجيل طالب جديد - جامعة حلوان</h2>
        <form id="registerForm">
            
            <!-- الاسم الرباعي -->
            <div class="form-group">
                <label for="fullName">الاسم الرباعي</label>
                <input type="text" id="fullName" placeholder="أدخل اسمك الرباعي" required>
            </div>

            <!-- رقم الهاتف -->
            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="أدخل رقم هاتفك المحمول" required>
            </div>

            <!-- البريد الإلكتروني -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </div>

            <!-- كلمة المرور -->
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة مرور قوية" required>
            </div>

            <!-- السنة الدراسية (السبينر) -->
            <div class="form-group">
                <label for="academicYear">السنة الدراسية</label>
                <select id="academicYear" required>
                    <option value="" disabled selected>اختر الفرقة الدراسية...</option>
                    <option value="1">الفرقة الأولى</option>
                    <option value="2">الفرقة الثانية</option>
                    <option value="3">الفرقة الثالثة</option>
                    <option value="4">الفرقة الرابعة</option>
                </select>
            </div>

            <!-- رقم البطاقة -->
            <div class="form-group">
                <label for="nationalId">رقم البطاقة (القومي)</label>
                <input type="text" id="nationalId" placeholder="أدخل رقم البطاقة المكون من 14 رقماً" maxlength="14" required>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" class="btn-submit">تسجيل الحساب</button>

            <div class="login-link">
                لديك حساب بالفعل؟ <a href="#">تسجيل الدخول</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم استلام بياناتك بنجاح! حسابك في انتظار موافقة الإدارة.');
        });
    </script>

</body>
</html>
