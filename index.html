<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - البوابة الطلابية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #2980b9;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
        .switch-text span {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .switch-text span:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }

        /* تصميم الـ Toast Messages الاحترافية */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success { background-color: #2ecc71; }
        .toast.error { background-color: #e74c3c; }
        .toast.warning { background-color: #f39c12; }

        /* نافذة التنبيه الاحترافية (Custom Professional Modal) للرفض والانتظار */
        #customAlertOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }
        .custom-alert-box {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: modalScale 0.3s ease;
        }
        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-alert-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }
        .custom-alert-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }
        .custom-alert-msg {
            font-size: 14.5px;
            color: #475569;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .custom-alert-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .custom-alert-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- حاوية الـ Toast Messages -->
    <div id="toast-container"></div>

    <!-- نافذة التنبيه الاحترافية -->
    <div id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-icon" id="alertIcon">⚠️</div>
            <div class="custom-alert-title" id="alertTitle">تنبيه هام</div>
            <div class="custom-alert-msg" id="alertMessage">رسالة التنبيه هنا...</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">حسناً، فهمت</button>
        </div>
    </div>

    <div class="card-container">
        
        <!-- قسم تسجيل الدخول -->
        <div id="loginSection">
            <h2>تسجيل الدخول - جامعة حلوان</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit" class="btn-submit">دخول</button>
                <div class="switch-text">
                    ليس لديك حساب؟ <span onclick="switchForm('register')">انشئ حساب جديد</span>
                </div>
            </form>
        </div>

        <!-- قسم إنشاء الحساب -->
        <div id="registerSection" class="hidden">
            <h2>تسجيل طالب جديد</h2>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullName">الاسم الرباعي</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الرباعي">
                </div>
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="أدخل رقم هاتفك المحمول">
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة مرور قوية">
                </div>
                <div class="form-group">
                    <label for="academicYear">السنة الدراسية</label>
                    <select id="academicYear">
                        <option value="" disabled selected>اختر الفرقة الدراسية...</option>
                        <option value="1">الفرقة الأولى</option>
                        <option value="2">الفرقة الثانية</option>
                        <option value="3">الفرقة الثالثة</option>
                        <option value="4">الفرقة الرابعة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nationalId">رقم البطاقة (القومي)</label>
                    <input type="text" id="nationalId" placeholder="أدخل رقم البطاقة المكون من 14 رقماً" maxlength="14">
                </div>
                <button type="submit" class="btn-submit">تسجيل الحساب</button>
                <div class="switch-text">
                    لديك حساب بالفعل؟ <span onclick="switchForm('login')">تسجيل الدخول</span>
                </div>
            </form>
        </div>

    </div>

    <!-- سكربتات ربط Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 4000);
        }

        window.showAlert = function(title, message, icon = '⚠️') {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertIcon').innerText = icon;
            document.getElementById('customAlertOverlay').style.display = 'flex';
        }

        window.closeCustomAlert = function() {
            document.getElementById('customAlertOverlay').style.display = 'none';
        }

        window.switchForm = function(target) {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            
            if(target === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
            }
        }

        // معالجة تسجيل حساب جديد
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const academicYear = document.getElementById('academicYear').value;
            const nationalId = document.getElementById('nationalId').value.trim();

            if (!fullName || !phone || !email || !password || !academicYear || !nationalId) {
                showToast('يرجى ملء جميع الحقول المطلوبة بدقة!', 'error');
                return;
            }

            if (nationalId.length !== 14) {
                showToast('رقم البطاقة يجب أن يكون 14 رقماً صحيحاً!', 'error');
                return;
            }

            try {
                const usersRef = collection(db, "users");

                const qNational = query(usersRef, where("nationalId", "==", nationalId));
                const snapNational = await getDocs(qNational);
                if (!snapNational.empty) {
                    showToast('رقم البطاقة هذا مسجل مسبقاً بحساب آخر!', 'error');
                    return;
                }

                const qPhone = query(usersRef, where("phone", "==", phone));
                const snapPhone = await getDocs(qPhone);
                if (!snapPhone.empty) {
                    showToast('رقم الهاتف هذا مسجل مسبقاً بحساب آخر!', 'error');
                    return;
                }

                const studentId = 'HU-' + Math.floor(100000 + Math.random() * 900000);

                await addDoc(usersRef, {
                    student_id: studentId,
                    fullName: fullName,
                    phone: phone,
                    email: email,
                    password: password,
                    academicYear: academicYear,
                    nationalId: nationalId,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                });

                showAlert(
                    'تم إرسال الطلب',
                    `تم تسجيل بياناتك بنجاح! رقم الـ ID الخاص بك هو:\n\n${studentId}\n\nيرجى الانتظار حتى يتم مراجعة وتفعيل الحساب من قبل الإدارة.`,
                    '✅'
                );

                document.getElementById('registerForm').reset();
                switchForm('login');

            } catch (error) {
                console.error("Error adding document: ", error);
                showToast('حدث خطأ أثناء التسجيل، يرجى المحاولة لاحقاً.', 'error');
            }
        });

        // معالجة تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                showToast('يرجى إدخال البريد الإلكتروني وكلمة المرور!', 'error');
                return;
            }

            try {
                const usersRef = collection(db, "users");
                
                const qEmailCheck = query(usersRef, where("email", "==", email));
                const emailSnapshot = await getDocs(qEmailCheck);

                if (emailSnapshot.empty) {
                    showToast('هذا الحساب غير مسجل في قاعدة البيانات، يرجى إنشاء حساب جديد.', 'error');
                    return;
                }

                const qLogin = query(usersRef, where("email", "==", email), where("password", "==", password));
                const querySnapshot = await getDocs(qLogin);

                if (querySnapshot.empty) {
                    showToast('كلمة المرور غير صحيحة!', 'error');
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                if (userData.status === 'pending') {
                    showAlert(
                        'حسابك قيد المراجعة',
                        'مرحباً بك، الحساب الخاص بك لم يتم اعتماده وتفعيله من الإدارة بعد. يرجى الانتظار والمحاولة لاحقاً.',
                        '⏳'
                    );
                } else if (userData.status === 'rejected' || userData.status === 'banned') {
                    showAlert(
                        'تم رفض / حظر الحساب',
                        'عذراً، تم رفض طلب إنشاء هذا الحساب أو حظره من قبل الإدارة. يرجى مراجعة شؤون الطلاب.',
                        '🚫'
                    );
                } else if (userData.status === 'approved') {
                    showToast('تم تسجيل الدخول بنجاح! أهلاً بك يا ' + userData.fullName, 'success');
                    localStorage.setItem('currentStudent', JSON.stringify(userData));
                    setTimeout(() => {
                        location.href = 'student.html';
                    }, 1500);
                }

            } catch (error) {
                console.error("Login error: ", error);
                showToast('حدث خطأ أثناء تسجيل الدخول.', 'error');
            }
        });
    </script>

</body>
</html>
