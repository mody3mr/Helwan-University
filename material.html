<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - تفاصيل المادة والأقسام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .logo { font-size: 20px; font-weight: 700; color: #0f172a; cursor: pointer; }
        .back-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #475569; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .material-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
        }
        .material-header h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .material-header p { font-size: 15px; opacity: 0.85; }

        /* الأقسام المنشورة */
        .section-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .content-card {
            background: #f8fafc;
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .content-card:hover { border-color: #cbd5e1; background: #fff; }
        .content-info h3 { font-size: 16px; color: #0f172a; margin-bottom: 5px; font-weight: 700; }
        .content-info p { font-size: 13px; color: #64748b; }
        .btn-download {
            background: #22c55e;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-download:hover { background: #16a34a; }
        .no-data { text-align: center; color: #94a3b8; padding: 25px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.href='student.html'">جامعة حلوان</div>
        <a href="student.html" class="back-btn">العودة للرئيسية</a>
    </header>

    <div class="container">
        <div class="material-header">
            <h1 id="materialTitleDisplay">جاري التحميل...</h1>
            <p id="materialProfDisplay">أستاذ المادة: جاري التحميل...</p>
        </div>

        <!-- الأقسام الحقيقية المنشورة للمادة -->
        <div id="sectionsContainer">
            <div class="section-box">
                <div class="no-data">جاري تحميل أقسام ومحتويات المادة...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const materialTitle = urlParams.get('title');

        if (!materialTitle) {
            alert('لم يتم تحديد المادة!');
            location.href = 'student.html';
        } else {
            document.getElementById('materialTitleDisplay').innerText = materialTitle;
            fetchMaterialInfoAndSections(materialTitle);
        }

        // جلب معلومات المادة (الدكتور والمعيد) والأقسام والملفات بشكل لحظي (Real-time)
        async function fetchMaterialInfoAndSections(title) {
            try {
                // 1. جلب بيانات الدكتور والمعيد للمادة الأساسية
                const matQuery = query(collection(db, "materials"), where("title", "==", title));
                const matSnap = await getDocs(matQuery);
                let profName = 'غير محدد';
                let assistName = 'غير محدد';
                matSnap.forEach(d => {
                    const m = d.data();
                    if(m.professorName) profName = m.professorName;
                    if(m.assistantName) assistName = m.assistantName;
                });
                document.getElementById('materialProfDisplayinnerHTML') = '';
                document.getElementById('materialProfDisplay').innerText = `أستاذ المادة: ${profName} | المعيد: ${assistName}`;

                // 2. الاستماع اللحظي للأقسام المنشورة لهذه المادة
                const secQuery = query(collection(db, "materialSections"), where("materialTitle", "==", title));
                
                onSnapshot(secQuery, async (secSnapshot) => {
                    const container = document.getElementById('sectionsContainer');

                    if (secSnapshot.empty) {
                        container.innerHTML = `
                            <div class="section-box">
                                <div class="no-data">لا توجد أقسام منشورة لهذه المادة حتى الآن.</div>
                            </div>
                        `;
                        return;
                    }

                    // جلب الملفات التابعة للمادة لعرضها داخل الأقسام
                    const filesQuery = query(collection(db, "materialContents"), where("materialTitle", "==", title));
                    const filesSnap = await getDocs(filesQuery);
                    let allFiles = [];
                    filesSnap.forEach(f => allFiles.push(f.data()));

                    let sectionsHtml = '';
                    secSnapshot.forEach(secDoc => {
                        const sec = secDoc.data();
                        const secName = sec.sectionName;

                        // تصفية الملفات التي تنتمي لهذا القسم بالذات
                        const sectionFiles = allFiles.filter(f => f.sectionName === secName);

                        let filesHtml = '';
                        if (sectionFiles.length > 0) {
                            sectionFiles.forEach(item => {
                                const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG') : '';
                                const roleLabel = item.targetRole === 'professor' ? 'الدكتور' : 'المعيد';

                                filesHtml += `
                                    <div class="content-card">
                                        <div class="content-info">
                                            <h3>📂 ${item.title}</h3>
                                            <p>بواسطة (${roleLabel}): <b>${item.publisherName || 'الإدارة'}</b> | التاريخ: ${dateFormatted}</p>
                                        </div>
                                        <a href="${item.fileUrl || '#'}" target="_blank" class="btn-download">عرض / تحميل</a>
                                    </div>
                                `;
                            });
                        } else {
                            filesHtml = `<div class="no-data">لا توجد ملفات مرفوعة في هذا القسم حالياً.</div>`;
                        }

                        sectionsHtml += `
                            <div class="section-box">
                                <div class="section-title">📁 ${secName}</div>
                                <div class="content-grid">
                                    ${filesHtml}
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = sectionsHtml;
                });

            } catch (e) {
                console.error("Error fetching material details:", e);
                document.getElementById('sectionsContainer').innerHTML = `<div class="section-box"><div class="no-data" style="color:red;">حدث خطأ أثناء تحميل محتويات المادة.</div></div>`;
            }
        }
    </script>

</body>
</html>
