<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - تفاصيل المادة ومحتوياتها</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .logo { font-size: 20px; font-weight: 700; color: #0f172a; cursor: pointer; }
        .back-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #475569; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .material-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
        }
        .material-header h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .material-header p { font-size: 15px; opacity: 0.85; }

        /* الأقسام المنفصلة: الدكتور vs المعيد */
        .section-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .content-card {
            background: #f8fafc;
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .content-card:hover { border-color: #cbd5e1; background: #fff; }
        .content-info h3 { font-size: 16px; color: #0f172a; margin-bottom: 5px; font-weight: 700; }
        .content-info p { font-size: 13px; color: #64748b; }
        .btn-download {
            background: #22c55e;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-download:hover { background: #16a34a; }
        .no-data { text-align: center; color: #94a3b8; padding: 25px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.href='student.html'">جامعة حلوان</div>
        <a href="student.html" class="back-btn">العودة للرئيسية</a>
    </header>

    <div class="container">
        <div class="material-header">
            <h1 id="materialTitleDisplay">جاري التحميل...</h1>
            <p>استعرض محتويات المادة المنفصلة (ملفات الدكتور وملفات المعيد)</p>
        </div>

        <!-- قسم الدكتور -->
        <div class="section-box">
            <div class="section-title">👨‍🏫 ملفات وعروض أستاذ المادة (الدكتور)</div>
            <div class="content-grid" id="professorContainer">
                <div class="no-data">جاري التحميل...</div>
            </div>
        </div>

        <!-- قسم المعيد -->
        <div class="section-box">
            <div class="section-title">👨‍💻 ملفات وسكاشن المعيد (المساعد)</div>
            <div class="content-grid" id="assistantContainer">
                <div class="no-data">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const materialTitle = urlParams.get('title');

        if (!materialTitle) {
            alert('لم يتم تحديد المادة!');
            location.href = 'student.html';
        } else {
            document.getElementById('materialTitleDisplay').innerText = materialTitle;
            fetchContent(materialTitle);
        }

        async function fetchContent(title) {
            const profContainer = document.getElementById('professorContainer');
            const assistContainer = document.getElementById('assistantContainer');

            try {
                const q = query(collection(db, "materialContents"), where("materialTitle", "==", title));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    profContainer.innerHTML = `<div class="no-data">لا توجد ملفات منشورة للدكتور حالياً.</div>`;
                    assistContainer.innerHTML = `<div class="no-data">لا توجد ملفات منشورة للمعيد حالياً.</div>`;
                    return;
                }

                let profHtml = '';
                let assistHtml = '';
                let profCount = 0;
                let assistCount = 0;

                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG') : '';
                    
                    // ترجمة نوع المحتوى لعرضه بوضوح
                    let typeLabel = 'ملف';
                    if (item.type === 'book') typeLabel = 'كتاب دراسي';
                    else if (item.type === 'exam') typeLabel = 'امتحان سابق';
                    else if (item.type === 'quiz') typeLabel = 'امتحان تذكيري (كويز)';
                    else if (item.type === 'video') typeLabel = 'فيديو شرح';
                    else if (item.type === 'custom') typeLabel = 'قسم مخصص';

                    const card = `
                        <div class="content-card">
                            <div class="content-info">
                                <h3>[${typeLabel}] ${item.title}</h3>
                                <p>بواسطة: <b>${item.publisherName || 'الإدارة'}</b> | التاريخ: ${dateFormatted}</p>
                            </div>
                            <a href="${item.fileUrl || '#'}" target="_blank" class="btn-download">عرض / تحميل</a>
                        </div>
                    `;

                    if (item.targetRole === 'professor') {
                        profHtml += card;
                        profCount++;
                    } else if (item.targetRole === 'assistant') {
                        assistHtml += card;
                        assistCount++;
                    }
                });

                profContainer.innerHTML = profCount > 0 ? profHtml : `<div class="no-data">لا توجد ملفات منشورة للدكتور حالياً.</div>`;
                assistContainer.innerHTML = assistCount > 0 ? assistHtml : `<div class="no-data">لا توجد ملفات منشورة للمعيد حالياً.</div>`;

            } catch (e) {
                console.error(e);
                profContainer.innerHTML = `<div class="no-data" style="color:red;">حدث خطأ في تحميل البيانات.</div>`;
                assistContainer.innerHTML = `<div class="no-data" style="color:red;">حدث خطأ في تحميل البيانات.</div>`;
            }
        }
    </script>

</body>
</html>
