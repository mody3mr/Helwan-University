<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - تفاصيل المادة والأقسام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .logo { font-size: 20px; font-weight: 700; color: #0f172a; cursor: pointer; }
        .back-btn {
            background: #64748b; color: white; border: none; padding: 8px 18px;
            border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #475569; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .material-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; padding: 35px; border-radius: 16px; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
        }
        .material-header h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .material-header p { font-size: 15px; opacity: 0.85; }

        .tabs-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .tab-btn {
            flex: 1; background: #ffffff; border: 2px solid #cbd5e1; padding: 14px;
            border-radius: 14px; font-size: 16px; font-weight: 700; color: #475569;
            cursor: pointer; text-align: center; transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tab-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tab-btn.active {
            background: #2563eb; color: white; border-color: #2563eb;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .section-box {
            background: white; border-radius: 16px; padding: 30px; margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0;
        }
        .section-title {
            font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .content-card {
            background: #f8fafc; padding: 18px 22px; border-radius: 12px; border: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
            flex-wrap: wrap; gap: 15px;
        }
        .content-card:hover { border-color: #cbd5e1; background: #fff; }
        .content-info h3 { font-size: 15px; color: #0f172a; margin-bottom: 5px; font-weight: 700; }
        .content-info p { font-size: 13px; color: #64748b; }
        
        .card-actions { display: flex; gap: 10px; }
        .btn-view {
            background: #2563eb; color: white; padding: 8px 16px; border-radius: 8px;
            border: none; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s;
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-view:hover { background: #1d4ed8; }
        .btn-download {
            background: #22c55e; color: white; padding: 8px 16px; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 13px; transition: background 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-download:hover { background: #16a34a; }

        .no-data { text-align: center; color: #94a3b8; padding: 25px; font-size: 14px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* نافذة العرض الداخلي للملفات */
        #fileModalOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 99999; padding: 20px;
        }
        .modal-box {
            background: white; width: 100%; max-width: 900px; height: 85vh;
            border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: modalScale 0.3s ease;
        }
        @keyframes modalScale {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            padding: 15px 25px; background: #0f172a; color: white;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .close-modal {
            background: #ef4444; color: white; border: none; width: 32px; height: 32px;
            border-radius: 50%; font-weight: 700; font-size: 16px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: background 0.2s;
        }
        .close-modal:hover { background: #dc2626; }
        .modal-body { flex-grow: 1; background: #e2e8f0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .modal-body iframe, .modal-body img { width: 100%; height: 100%; border: none; object-fit: contain; }
    </style>
</head>
<body>

    <!-- نافذة العرض الداخلي -->
    <div id="fileModalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalFileTitle">عرض المحتوى</h3>
                <button class="close-modal" onclick="closeFileModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBodyContainer"></div>
        </div>
    </div>

    <header>
        <div class="logo" onclick="location.href='student.html'">جامعة حلوان</div>
        <a href="student.html" class="back-btn">العودة للرئيسية</a>
    </header>

    <div class="container">
        <div class="material-header">
            <h1 id="materialTitleDisplay">جاري التحميل...</h1>
            <p id="materialProfDisplay">أستاذ المادة: جاري التحميل...</p>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('professor')">👨‍🏫 أستاذ المادة (الدكتور)</button>
            <button class="tab-btn" onclick="switchTab('assistant')">👨‍💻 المعيد (المساعد)</button>
        </div>

        <div id="professorTab" class="tab-content active">
            <div id="profSectionsContainer"><div class="section-box"><div class="no-data">جاري التحميل...</div></div></div>
        </div>

        <div id="assistantTab" class="tab-content">
            <div id="assistSectionsContainer"><div class="section-box"><div class="no-data">جاري التحميل...</div></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const materialTitle = urlParams.get('title');

        if (!materialTitle) {
            alert('لم يتم تحديد المادة!');
            location.href = 'student.html';
        } else {
            document.getElementById('materialTitleDisplay').innerText = materialTitle;
            initMaterialPage(materialTitle);
        }

        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'professor') {
                document.querySelector('.tabs-container button:nth-child(1)').classList.add('active');
                document.getElementById('professorTab').classList.add('active');
            } else {
                document.querySelector('.tabs-container button:nth-child(2)').classList.add('active');
                document.getElementById('assistantTab').classList.add('active');
            }
        }

        function getEmbeddableUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                return url.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
            }
            return url;
        }

        window.openFileModal = function(title, fileUrl) {
            const overlay = document.getElementById('fileModalOverlay');
            const titleEl = document.getElementById('modalFileTitle');
            const bodyContainer = document.getElementById('modalBodyContainer');

            titleEl.innerText = title;
            const embedUrl = getEmbeddableUrl(fileUrl);

            if (fileUrl.match(/\.(jpeg|jpg|gif|png)$/i) || fileUrl.includes('image')) {
                bodyContainer.innerHTML = `<img src="${fileUrl}" alt="${title}">`;
            } else {
                bodyContainer.innerHTML = `<iframe src="${embedUrl}" allow="autoplay"></iframe>`;
            }

            overlay.style.display = 'flex';
        }

        window.closeFileModal = function() {
            document.getElementById('fileModalOverlay').style.display = 'none';
            document.getElementById('modalBodyContainer').innerHTML = '';
        }

        async function initMaterialPage(title) {
            try {
                const matQuery = query(collection(db, "materials"), where("title", "==", title));
                const matSnap = await getDocs(matQuery);
                let profName = 'غير محدد';
                let assistName = 'غير محدد';
                matSnap.forEach(d => {
                    const m = d.data();
                    if(m.professorName) profName = m.professorName;
                    if(m.assistantName) assistName = m.assistantName;
                });
                document.getElementById('materialProfDisplay').innerText = `أستاذ المادة: ${profName} | المعيد: ${assistName}`;

                const secQuery = query(collection(db, "materialSections"), where("materialTitle", "==", title));
                const filesQuery = query(collection(db, "materialContents"), where("materialTitle", "==", title));

                onSnapshot(secQuery, (secSnap) => {
                    getDocs(filesQuery).then(filesSnap => {
                        let sections = [];
                        secSnap.forEach(s => sections.push(s.data()));

                        let allFiles = [];
                        filesSnap.forEach(f => allFiles.push({ id: f.id, ...f.data() }));

                        renderTabContent('professor', sections, allFiles, 'profSectionsContainer');
                        renderTabContent('assistant', sections, allFiles, 'assistSectionsContainer');
                    });
                });

            } catch (e) {
                console.error(e);
            }
        }

        function renderTabContent(roleTarget, sections, allFiles, containerId) {
            const container = document.getElementById(containerId);
            const roleFiles = allFiles.filter(f => f.targetRole === roleTarget);

            if (sections.length === 0 && roleFiles.length === 0) {
                container.innerHTML = `<div class="section-box"><div class="no-data">لا توجد محتويات منشورة في هذا القسم حالياً.</div></div>`;
                return;
            }

            let html = '';
            sections.forEach(sec => {
                const secName = sec.sectionName;
                const matchedFiles = roleFiles.filter(f => f.sectionName === secName);

                if (matchedFiles.length > 0) {
                    let filesHtml = '';
                    matchedFiles.forEach(item => {
                        const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG') : '';
                        
                        let actionButtons = '';
                        if (item.contentType === 'skill_quiz') {
                            actionButtons = `<a href="quiz.html?id=${item.id}" class="btn-view" style="background:#f59e0b;">بدء الامتحان</a>`;
                        } else {
                            actionButtons = `
                                <button class="btn-view" onclick="openFileModal('${item.title.replace(/'/g, "\\'")}', '${item.fileUrl}')">عرض الملف</button>
                                <a href="${item.fileUrl || '#'}" target="_blank" class="btn-download">تحميل</a>
                            `;
                        }

                        filesHtml += `
                            <div class="content-card">
                                <div class="content-info">
                                    <h3>📁 ${item.title}</h3>
                                    <p>بواسطة: <b>${item.publisherName || 'الإدارة'}</b> | التاريخ: ${dateFormatted}</p>
                                </div>
                                <div class="card-actions">
                                    ${actionButtons}
                                </div>
                            </div>
                        `;
                    });

                    html += `
                        <div class="section-box">
                            <div class="section-title">📂 ${secName}</div>
                            <div class="content-grid">
                                ${filesHtml}
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html !== '' ? html : `<div class="section-box"><div class="no-data">لا توجد أقسام أو ملفات مرفوعة هنا حالياً.</div></div>`;
        }
    </script>

</body>
</html>
