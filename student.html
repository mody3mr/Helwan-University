<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - بوابة الطالب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .logo-area span { color: #3b82f6; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        /* الإشعارات */
        .notification-container {
            position: relative;
        }
        .bell-btn {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #475569;
            transition: background 0.2s;
            position: relative;
        }
        .bell-btn:hover { background: #e2e8f0; }
        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .notifications-dropdown {
            position: absolute;
            left: 0;
            top: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 340px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            z-index: 1100;
            border: 1px solid #f1f5f9;
        }
        .notifications-dropdown.show { display: flex; }
        .notif-header {
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-read-all {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo';
        }
        .btn-read-all:hover { text-decoration: underline; }

        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notif-item:hover { background: #f8fafc; }
        .notif-item.unread { background: #eff6ff; border-right: 3px solid #3b82f6; }
        .notif-item p { margin-bottom: 3px; font-weight: 700; color: #0f172a; }
        .notif-item span.subtitle { font-size: 12.5px; color: #475569; display: block; margin-top: 2px; }
        .notif-item span.time { font-size: 11px; color: #94a3b8; display: block; margin-top: 6px; }

        /* بروفايل المستخدم */
        .user-menu-container {
            position: relative;
            cursor: pointer;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        .dropdown-menu {
            position: absolute;
            left: 0;
            top: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu a {
            padding: 12px 18px;
            text-decoration: none;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .dropdown-menu a:hover { background: #f8fafc; }
        .dropdown-menu a.logout {
            color: #ef4444;
            border-top: 1px solid #f1f5f9;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 100%, #1d4ed8 0%);
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
        }
        .welcome-banner h1 { font-size: 26px; margin-bottom: 8px; }
        .welcome-banner p { font-size: 15px; opacity: 0.9; }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .material-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }
        .material-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: #3b82f6;
        }
        .material-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }
        .material-card h3 { font-size: 18px; color: #1e293b; margin-bottom: 8px; }
        .material-card p { font-size: 13px; color: #64748b; line-height: 1.6; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #e74c3c; }
        .toast.warning { background-color: #f59e0b; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <div class="logo-area">جامعة <span>حلوان</span></div>
        <div class="header-right">
            <!-- الجرس والإشعارات -->
            <div class="notification-container">
                <button class="bell-btn" onclick="toggleNotifications()">
                    🔔
                    <span class="badge" id="notifBadge" style="display: none;">0</span>
                </button>
                <div class="notifications-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        الإشعارات الجديدة
                        <button class="btn-read-all" onclick="markAllAsRead(event)">قراءة الكل ✔</button>
                    </div>
                    <div id="notifList">
                        <div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">جاري التحميل...</div>
                    </div>
                </div>
            </div>

            <!-- بروفايل المستخدم -->
            <div class="user-menu-container" onclick="toggleUserDropdown()">
                <div class="user-profile">
                    <span id="studentNameDisplay">جاري التحميل...</span> ▾
                </div>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="settings.html">إعدادات الحساب</a>
                    <a href="#" class="logout" onclick="logout()">تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="welcome-banner">
            <h1 id="welcomeTitle">أهلاً بك يا طالب</h1>
            <p id="academicYearDisplay">الفرقة الدراسية: جاري التحميل...</p>
        </div>

        <div class="section-title">📚 خريطة المواد الدراسية</div>
        <div class="materials-grid" id="materialsGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background: white; border-radius: 14px; border: 1px solid #e2e8f0;">
                جاري تحميل المواد المخصصة لفرقتك الدراسية...
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentStudent = null;
        let allNotifsCache = [];

        window.toggleUserDropdown = function() {
            document.getElementById('userDropdown').classList.toggle('show');
            document.getElementById('notifDropdown').classList.remove('show');
        }

        window.toggleNotifications = function() {
            document.getElementById('notifDropdown').classList.toggle('show');
            document.getElementById('userDropdown').classList.remove('show');
        }

        // إغلاق قوائم الإشعارات والبروفايل عند الضغط في أي مكان خارجي
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.notification-container')) {
                document.getElementById('notifDropdown').classList.remove('show');
            }
            if (!event.target.closest('.user-menu-container')) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        window.logout = function() {
            localStorage.removeItem('currentStudent');
            location.href = 'index.html';
        }

        const studentDataStr = localStorage.getItem('currentStudent');
        if (!studentDataStr) {
            location.href = 'index.html';
        } else {
            currentStudent = JSON.parse(studentDataStr);
            initStudentDashboard();
        }

        function initStudentDashboard() {
            // مزامنة حالة وحجم الفرقة مباشرة من قاعدة البيانات بدون الحاجة لمسح الكوكيز
            const qStudent = query(collection(db, "users"), where("student_id", "==", currentStudent.student_id));
            onSnapshot(qStudent, (snapshot) => {
                if (!snapshot.empty) {
                    const updatedData = snapshot.docs[0].data();
                    
                    if (updatedData.status === 'banned' || updatedData.status === 'rejected') {
                        alert('تم حظر أو رفض حسابك من الإدارة.');
                        logout();
                        return;
                    }

                    if (updatedData.academicYear !== currentStudent.academicYear) {
                        localStorage.setItem('currentStudent', JSON.stringify(updatedData));
                        location.reload();
                    } else {
                        currentStudent = updatedData;
                        localStorage.setItem('currentStudent', JSON.stringify(updatedData));
                        document.getElementById('studentNameDisplay').innerText = updatedData.fullName;
                        document.getElementById('welcomeTitle').innerText = 'أهلاً بك، ' + updatedData.fullName;
                        document.getElementById('academicYearDisplay').innerText = 'الفرقة الدراسية: الفرقة ' + updatedData.academicYear;
                    }
                }
            });

            fetchMaterialsRealtime(currentStudent.academicYear);
            fetchNotifications(currentStudent);
        }

        function fetchMaterialsRealtime(year) {
            const grid = document.getElementById('materialsGrid');
            const q = query(collection(db, "materials"), where("academicYear", "==", String(year)));

            onSnapshot(q, (querySnapshot) => {
                if (querySnapshot.empty) {
                    grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background:white; border-radius:14px; border: 1px solid #e2e8f0;">لا توجد مواد منشورة لهذه الفرقة حتى الآن.</div>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const material = docSnap.data();
                    const prof = material.professorName ? `أستاذ المادة: ${material.professorName}` : 'أستاذ المادة: غير محدد';
                    const assist = material.assistantName ? ` | المعيد: ${material.assistantName}` : '';
                    
                    html += `
                        <div class="material-card" onclick="openMaterialDetails('${material.title}')">
                            <h3>📚 ${material.title}</h3>
                            <p>${prof}${assist}</p>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            });
        }

        function fetchNotifications(student) {
            const notifList = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            const qNotifs = query(collection(db, "notifications"));
            
            onSnapshot(qNotifs, (snapshot) => {
                let allNotifs = [];

                snapshot.forEach(d => {
                    const item = d.data();
                    let isForThisStudent = false;

                    if (item.target_group === 'all') {
                        isForThisStudent = true;
                    } else if (item.target_group === 'year' && String(item.target_year) === String(student.academicYear)) {
                        isForThisStudent = true;
                    } else if (item.target_group === 'student' && item.student_id === student.student_id) {
                        isForThisStudent = true;
                    } else if (!item.target_group && (!item.student_id || item.student_id === student.student_id)) {
                        isForThisStudent = true;
                    }

                    if (isForThisStudent) {
                        let inferredLink = item.link || '#';
                        if (inferredLink === '#' && item.message) {
                            const match = item.message.match(/المادة:\s*([^(]+)/);
                            if (match && match[1]) {
                                inferredLink = `material.html?title=${encodeURIComponent(match[1].trim())}`;
                            }
                        }

                        allNotifs.push({
                            id: d.id,
                            title: item.title,
                            subtitle: item.message || '',
                            link: inferredLink,
                            date: item.createdAt || ''
                        });
                    }
                });

                // ترتيب الإشعارات من الأحدث للأقدم
                allNotifs.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                allNotifsCache = allNotifs;

                if (allNotifs.length === 0) {
                    notifList.innerHTML = `<div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">لا توجد إشعارات جديدة</div>`;
                    badge.style.display = 'none';
                    return;
                }

                const readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + student.student_id) || '[]');
                let html = '';
                let unreadCount = 0;

                allNotifs.forEach(notif => {
                    const isRead = readNotifs.includes(notif.id);
                    if (!isRead) unreadCount++;

                    // صياغة التاريخ والوقت بوضوح
                    const dateObj = notif.date ? new Date(notif.date) : null;
                    const dateStr = dateObj ? dateObj.toLocaleDateString('ar-EG') : '';
                    const timeStr = dateObj ? dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';

                    html += `
                        <div class="notif-item ${!isRead ? 'unread' : ''}" onclick="handleNotificationClick('${notif.id}', '${notif.link}', '${student.student_id}')">
                            <p>${notif.title}</p>
                            <span class="subtitle">${notif.subtitle}</span>
                            <span class="time">🕒 ${dateStr} - ${timeStr}</span>
                        </div>
                    `;
                });

                notifList.innerHTML = html;
                if (unreadCount > 0) {
                    badge.innerText = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            });
        }

        window.markAllAsRead = function(e) {
            e.stopPropagation();
            let readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + currentStudent.student_id) || '[]');
            allNotifsCache.forEach(n => {
                if(!readNotifs.includes(n.id)) readNotifs.push(n.id);
            });
            localStorage.setItem('readNotifications_' + currentStudent.student_id, JSON.stringify(readNotifs));
            fetchNotifications(currentStudent);
        }

        window.handleNotificationClick = function(notifId, link, studentId) {
            let readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + studentId) || '[]');
            if (!readNotifs.includes(notifId)) {
                readNotifs.push(notifId);
                localStorage.setItem('readNotifications_' + studentId, JSON.stringify(readNotifs));
            }
            if (link && link !== '#') {
                location.href = link;
            }
        }

        window.openMaterialDetails = function(materialTitle) {
            location.href = `material.html?title=${encodeURIComponent(materialTitle)}`;
        }
    </script>
</body>
</html>
