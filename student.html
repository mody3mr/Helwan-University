<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - بوابة الطالب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }
        .logo-area span { 
            color: #3b82f6; 
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* الإشعارات */
        .notification-container {
            position: relative;
        }
        .bell-btn {
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: #475569;
            transition: background 0.2s;
            position: relative;
        }
        .bell-btn:hover { 
            background: #e2e8f0; 
        }
        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .notifications-dropdown {
            position: absolute;
            left: 0;
            top: 48px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 300px;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            z-index: 1100;
            border: 1px solid #f1f5f9;
        }
        .notifications-dropdown.show { 
            display: flex; 
        }
        .notif-header {
            padding: 12px 15px;
            font-weight: 700;
            font-size: 13.5px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-read-all {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo';
        }
        .btn-read-all:hover { 
            text-decoration: underline; 
        }

        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notif-item:hover { 
            background: #f8fafc; 
        }
        .notif-item.unread { 
            background: #eff6ff; 
            border-right: 3px solid #3b82f6; 
        }
        .notif-item p { 
            margin-bottom: 3px; 
            font-weight: 700; 
            color: #0f172a; 
        }
        .notif-item span.subtitle { 
            font-size: 12px; 
            color: #475569; 
            display: block; 
            margin-top: 2px; 
        }
        .notif-item span.time { 
            font-size: 11px; 
            color: #94a3b8; 
            display: block; 
            margin-top: 6px; 
        }

        /* بروفايل المستخدم */
        .user-menu-container {
            position: relative;
            cursor: pointer;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            color: #1e293b;
            font-size: 13.5px;
        }
        .dropdown-menu {
            position: absolute;
            left: 0;
            top: 48px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            z-index: 1100;
        }
        .dropdown-menu.show { 
            display: flex; 
        }
        .dropdown-menu a {
            padding: 12px 16px;
            text-decoration: none;
            color: #334155;
            font-size: 13.5px;
            font-weight: 600;
            transition: background 0.2s;
            border-bottom: 1px solid #f8fafc;
        }
        .dropdown-menu a:hover { 
            background: #f8fafc; 
        }
        .dropdown-menu a.logout {
            color: #ef4444;
            border-bottom: none;
            border-top: 1px solid #e2e8f0;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 100%, #1d4ed8 0%);
            color: white;
            padding: 25px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
        }
        .welcome-banner h1 { 
            font-size: 22px; 
            margin-bottom: 6px; 
        }
        .welcome-banner p { 
            font-size: 14px; 
            opacity: 0.9; 
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 15px;
        }
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }
        .material-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }
        .material-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: #3b82f6;
        }
        .material-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            border-color: #cbd5e1;
        }
        .material-card h3 { 
            font-size: 17px; 
            color: #1e293b; 
            margin-bottom: 6px; 
        }
        .material-card p { 
            font-size: 12.5px; 
            color: #64748b; 
            line-height: 1.5; 
        }

        .service-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 15px;
        }
        .service-modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalScale 0.3s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        
        #schedulesModalOverlay .service-modal {
            max-width: 95vw;
            height: 90vh;
            padding: 15px;
        }

        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .service-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .service-modal-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
        }
        .close-service-modal {
            background: #f1f5f9;
            color: #475569;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-service-modal:hover {
            background: #ef4444;
            color: white;
        }
        .service-modal-body {
            overflow-y: auto;
            flex-grow: 1;
        }
        .btn-submit {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .btn-disabled {
            background: #e2e8f0;
            color: #94a3b8;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: not-allowed;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #e74c3c; }
        .toast.warning { background-color: #f39c12; }

        @media (max-width: 480px) {
            header { padding: 12px 15px; }
            .logo-area { font-size: 16px; }
            .welcome-banner { padding: 20px 15px; }
            .welcome-banner h1 { font-size: 19px; }
            .user-profile span { display: none; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- نافذة الجداول -->
    <div class="service-modal-overlay" id="schedulesModalOverlay">
        <div class="service-modal">
            <div class="service-modal-header">
                <h3 id="schedulesModalTitle">الجداول</h3>
                <button class="close-service-modal" onclick="closeServiceModals()">✕</button>
            </div>
            <div class="service-modal-body" id="schedulesModalBody" style="display: flex; flex-direction: column; gap: 15px;">
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الحضور -->
    <div class="service-modal-overlay" id="attendanceModalOverlay">
        <div class="service-modal">
            <div class="service-modal-header">
                <h3>✋ تسجيل الحضور اليومي</h3>
                <button class="close-service-modal" onclick="closeServiceModals()">✕</button>
            </div>
            <div class="service-modal-body" id="attendanceModalBody">
            </div>
        </div>
    </div>

    <header>
        <div class="logo-area">جامعة <span>حلوان</span></div>
        <div class="header-right">
            <!-- الجرس والإشعارات -->
            <div class="notification-container">
                <button class="bell-btn" onclick="toggleNotifications()">
                    🔔
                    <span class="badge" id="notifBadge" style="display: none;">0</span>
                </button>
                <div class="notifications-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        الإشعارات الجديدة
                        <button class="btn-read-all" onclick="markAllAsRead(event)">قراءة الكل ✔</button>
                    </div>
                    <div id="notifList">
                        <div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">جاري التحميل...</div>
                    </div>
                </div>
            </div>

            <!-- بروفايل المستخدم وقائمة الخدمات -->
            <div class="user-menu-container" onclick="toggleUserDropdown()">
                <div class="user-profile">
                    <span id="studentNameDisplay">حساب الطالب</span> ▾
                </div>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="#" onclick="openScheduleModal('lecture', event)">📅 جدول المحاضرات</a>
                    <a href="#" onclick="openScheduleModal('exam', event)">📝 جدول الامتحانات</a>
                    <a href="#" onclick="openAttendanceModal(event)">✋ تسجيل الحضور</a>
                    <a href="settings.html">⚙️ إعدادات الحساب</a>
                    <a href="#" class="logout" onclick="logout()">🚪 تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="welcome-banner">
            <h1 id="welcomeTitle">أهلاً بك يا طالب</h1>
            <p id="academicYearDisplay">الفرقة الدراسية: جاري التحميل...</p>
        </div>

        <div class="section-title">📚 خريطة المواد الدراسية</div>
        <div class="materials-grid" id="materialsGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background: white; border-radius: 14px; border: 1px solid #e2e8f0;">
                جاري تحميل المواد المخصصة لفرقتك الدراسية...
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        let currentStudent = null;
        let allNotifsCache = [];

        window.toggleUserDropdown = function() {
            document.getElementById('userDropdown').classList.toggle('show');
            document.getElementById('notifDropdown').classList.remove('show');
        }

        window.toggleNotifications = function() {
            document.getElementById('notifDropdown').classList.toggle('show');
            document.getElementById('userDropdown').classList.remove('show');
        }

        window.closeServiceModals = function() {
            document.getElementById('schedulesModalOverlay').style.display = 'none';
            document.getElementById('attendanceModalOverlay').style.display = 'none';
            document.getElementById('schedulesModalBody').innerHTML = '';
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.notification-container')) {
                document.getElementById('notifDropdown').classList.remove('show');
            }
            if (!event.target.closest('.user-menu-container') && !event.target.closest('.dropdown-menu')) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        window.logout = function() {
            localStorage.removeItem('currentStudent');
            location.href = 'index.html';
        }

        const studentDataStr = localStorage.getItem('currentStudent');
        if (!studentDataStr) {
            location.href = 'index.html';
        } else {
            currentStudent = JSON.parse(studentDataStr);
            initStudentDashboard();
        }

        function initStudentDashboard() {
            const qStudent = query(collection(db, "users"), where("student_id", "==", currentStudent.student_id));
            onSnapshot(qStudent, (snapshot) => {
                if (!snapshot.empty) {
                    const updatedData = snapshot.docs[0].data();
                    
                    if (updatedData.status === 'banned' || updatedData.status === 'rejected') {
                        alert('تم حظر أو رفض حسابك من الإدارة.');
                        logout();
                        return;
                    }

                    if (updatedData.academicYear !== currentStudent.academicYear) {
                        localStorage.setItem('currentStudent', JSON.stringify(updatedData));
                        location.reload();
                    } else {
                        currentStudent = updatedData;
                        localStorage.setItem('currentStudent', JSON.stringify(updatedData));
                        document.getElementById('studentNameDisplay').innerText = updatedData.fullName;
                        document.getElementById('welcomeTitle').innerText = 'أهلاً بك، ' + updatedData.fullName;
                        document.getElementById('academicYearDisplay').innerText = 'الفرقة الدراسية: الفرقة ' + updatedData.academicYear;
                    }
                }
            });

            fetchMaterialsRealtime(currentStudent.academicYear);
            fetchNotifications(currentStudent);
        }

        function fetchMaterialsRealtime(year) {
            const grid = document.getElementById('materialsGrid');
            const q = query(collection(db, "materials"), where("academicYear", "==", String(year)));

            onSnapshot(q, (querySnapshot) => {
                if (querySnapshot.empty) {
                    grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background:white; border-radius:14px; border: 1px solid #e2e8f0;">لا توجد مواد منشورة لهذه الفرقة حتى الآن.</div>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const material = docSnap.data();
                    const prof = material.professorName ? `أستاذ المادة: ${material.professorName}` : 'أستاذ المادة: غير محدد';
                    const assist = material.assistantName ? ` | المعيد: ${material.assistantName}` : '';
                    
                    html += `
                        <div class="material-card" onclick="openMaterialDetails('${material.title}')">
                            <h3>📚 ${material.title}</h3>
                            <p>${prof}${assist}</p>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            });
        }

        function getEmbeddableUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) return url.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
            return url;
        }

        window.openScheduleModal = function(type, event) {
            event.stopPropagation();
            document.getElementById('userDropdown').classList.remove('show');
            
            const overlay = document.getElementById('schedulesModalOverlay');
            const titleEl = document.getElementById('schedulesModalTitle');
            const bodyEl = document.getElementById('schedulesModalBody');

            titleEl.innerText = type === 'lecture' ? '📅 جدول المحاضرات' : '📝 جدول الامتحانات';
            bodyEl.innerHTML = '<div style="text-align:center; padding: 20px; color:#64748b;">جاري تحميل الجداول...</div>';
            overlay.style.display = 'flex';

            const q = query(collection(db, "schedules"), where("academicYear", "==", String(currentStudent.academicYear)), where("type", "==", type));
            getDocs(q).then(snapshot => {
                if(snapshot.empty) {
                    bodyEl.innerHTML = `<div style="text-align:center; padding: 20px; color:#ef4444; font-weight:600;">لم يتم نشر جداول من هذا النوع لفرقتك حتى الآن.</div>`;
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const fileUrl = data.fileUrl || '';
                    let mediaHtml = '';
                    
                    if (fileUrl.match(/\.(jpeg|jpg|gif|png)$/i) || fileUrl.includes('image')) {
                        mediaHtml = `<img src="${fileUrl}" alt="جدول" style="width:100%; max-height: 60vh; object-fit: contain; border-radius: 8px;">`;
                    } else {
                        mediaHtml = `<iframe src="${getEmbeddableUrl(fileUrl)}" style="width:100%; height: 60vh; border:none; border-radius: 8px;" allow="autoplay"></iframe>`;
                    }

                    html += `
                        <div style="background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; flex-direction: column;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                                <h4 style="color: #0f172a; font-size:15px;">${data.title}</h4>
                                <a href="${fileUrl}" target="_blank" style="font-size:12.5px; color:#2563eb; text-decoration:none; font-weight:700; background: #eff6ff; padding: 5px 10px; border-radius: 6px;">فتح في نافذة جديدة ↗</a>
                            </div>
                            ${mediaHtml}
                        </div>
                    `;
                });
                bodyEl.innerHTML = html;
            }).catch(e => {
                bodyEl.innerHTML = '<div style="text-align:center; color:red;">حدث خطأ أثناء تحميل الجداول.</div>';
            });
        }

        // --- دالة فتح نافذة الحضور مباشر (تستخدم أيضاً عند الضغط على إشعار بدء المحاضرة) ---
        window.openAttendanceModal = function(event) {
            if (event) event.stopPropagation();
            const userDropdown = document.getElementById('userDropdown');
            if (userDropdown) userDropdown.classList.remove('show');
            const notifDropdown = document.getElementById('notifDropdown');
            if (notifDropdown) notifDropdown.classList.remove('show');
            
            const overlay = document.getElementById('attendanceModalOverlay');
            const bodyEl = document.getElementById('attendanceModalBody');
            bodyEl.innerHTML = '<div style="text-align:center; padding: 20px; color:#64748b;">جاري البحث عن محاضرات نشطة...</div>';
            overlay.style.display = 'flex';

            const q = query(collection(db, "attendanceSessions"), where("academicYear", "==", String(currentStudent.academicYear)), where("isActive", "==", true));
            
            onSnapshot(q, async (snapshot) => {
                if(snapshot.empty) {
                    bodyEl.innerHTML = `<div style="text-align:center; padding: 30px 10px; color:#64748b;">
                        <div style="font-size:40px; margin-bottom:10px;">😴</div>
                        <div style="font-weight:600; font-size:15px; color:#334155;">لا توجد محاضرات تطلب تسجيل الحضور حالياً.</div>
                    </div>`;
                    return;
                }

                // جلب السجلات في نفس اللحظة عشان نتأكد من التحديث الفوري للزرار
                const myRecordsQ = query(collection(db, "attendanceRecords"), where("studentId", "==", currentStudent.student_id));
                const myRecordsSnap = await getDocs(myRecordsQ);
                let attendedSessionIds = [];
                myRecordsSnap.forEach(d => attendedSessionIds.push(d.data().sessionId));

                let html = '';
                snapshot.forEach(doc => {
                    const session = doc.data();
                    const sId = doc.id;
                    const alreadyAttended = attendedSessionIds.includes(sId);

                    html += `
                        <div style="background: #ffffff; padding: 16px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);" id="session-box-${sId}">
                            <h4 style="color: #0f172a; margin-bottom: 5px; font-size:15px;">📚 المادة: ${session.materialTitle}</h4>
                            <p style="font-size: 12.5px; color: #475569; margin-bottom: 12px;">المحاضر: ${session.professorName}</p>
                            
                            <div id="btn-container-${sId}">
                                ${alreadyAttended 
                                    ? `<button class="btn-disabled" disabled>✔️ لقد قمت بتسجيل حضورك</button>` 
                                    : `<button class="btn-submit" onclick="registerMyAttendance('${sId}', '${session.lateThresholdISO}', '${session.materialTitle}', ${session.adminLat}, ${session.adminLng}, ${session.radiusMeters || 50})">تسجيل حضوري الآن ✋ (يتطلب GPS)</button>`
                                }
                            </div>
                        </div>
                    `;
                });
                bodyEl.innerHTML = html;
            });
        }

        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        window.registerMyAttendance = async function(sessionId, lateThresholdISO, materialTitle, adminLat, adminLng, radiusMeters) {
            if (!navigator.geolocation) {
                showToast('متصفحك لا يدعم الـ GPS!', 'error');
                return;
            }

            showToast('جاري التحقق من موقعك الجغرافي...', 'warning');

            navigator.geolocation.getCurrentPosition(async (position) => {
                const stuLat = position.coords.latitude;
                const stuLng = position.coords.longitude;
                
                const distance = getDistanceFromLatLonInM(adminLat, adminLng, stuLat, stuLng);

                if (distance > radiusMeters) {
                    showToast('❌ عذراً، أنت لست داخل نطاق قاعة المحاضرات!', 'error');
                    
                    try {
                        await addDoc(collection(db, "notifications"), {
                            title: "⚠️ محاولة تلاعب بالحضور",
                            message: `الطالب ${currentStudent.fullName} (${currentStudent.student_id}) حاول تسجيل الحضور لمادة ${materialTitle} من خارج النطاق بمسافة ${Math.round(distance)} متر!`,
                            type: 'system',
                            target_group: 'admin',
                            createdAt: new Date().toISOString()
                        });
                    } catch(err) { console.log(err); }
                    
                    return;
                }

                try {
                    const now = new Date();
                    const lateThreshold = new Date(lateThresholdISO);
                    const status = now > lateThreshold ? 'متأخر' : 'حاضر في الموعد';

                    await addDoc(collection(db, "attendanceRecords"), {
                        sessionId: sessionId,
                        materialTitle: materialTitle,
                        studentId: currentStudent.student_id,
                        studentName: currentStudent.fullName,
                        academicYear: currentStudent.academicYear,
                        timestamp: now.toISOString(),
                        status: status,
                        distanceMeters: Math.round(distance)
                    });
                    
                    showToast(`✔️ تم تسجيل حضورك بنجاح (${status})`, 'success');
                    
                    // تحديث فوري لشكل الزرار جوه الدايلوج من غير ما نعمل Refresh
                    const btnContainer = document.getElementById(`btn-container-${sessionId}`);
                    if (btnContainer) {
                        btnContainer.innerHTML = `<button class="btn-disabled" disabled>✔️ لقد قمت بتسجيل حضورك</button>`;
                    }

                } catch(e) {
                    showToast('حدث خطأ أثناء التسجيل. يرجى المحاولة.', 'error');
                }

            }, (error) => {
                showToast('❌ يجب السماح بالوصول لموقعك الجغرافي لتسجيل الحضور!', 'error');
            }, { enableHighAccuracy: true });
        }

        function fetchNotifications(student) {
            const notifList = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            const qNotifs = query(collection(db, "notifications"));
            
            onSnapshot(qNotifs, (snapshot) => {
                let allNotifs = [];

                snapshot.forEach(d => {
                    const item = d.data();
                    let isForThisStudent = false;

                    if (item.target_group === 'all') {
                        isForThisStudent = true;
                    } else if (item.target_group === 'year' && String(item.target_year) === String(student.academicYear)) {
                        isForThisStudent = true;
                    } else if (item.target_group === 'student' && item.student_id === student.student_id) {
                        isForThisStudent = true;
                    } else if (!item.target_group && (!item.student_id || item.student_id === student.student_id)) {
                        isForThisStudent = true;
                    }

                    if (isForThisStudent) {
                        let inferredLink = item.link || '#';
                        // لو الإشعار خاص ببدء المحاضرة، نخليه يفتح نافذة الحضور أوتوماتيك
                        if (item.title && item.title.includes("محاضرة جديدة بدأت")) {
                            inferredLink = 'attendance_action';
                        } else if (inferredLink === '#' && item.message) {
                            const match = item.message.match(/المادة:\s*([^(]+)/);
                            if (match && match[1]) {
                                inferredLink = `material.html?title=${encodeURIComponent(match[1].trim())}`;
                            }
                        }

                        allNotifs.push({
                            id: d.id,
                            title: item.title,
                            subtitle: item.message || '',
                            link: inferredLink,
                            date: item.createdAt || ''
                        });
                    }
                });

                allNotifs.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                allNotifsCache = allNotifs;

                if (allNotifs.length === 0) {
                    notifList.innerHTML = `<div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">لا توجد إشعارات جديدة</div>`;
                    badge.style.display = 'none';
                    return;
                }

                const readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + student.student_id) || '[]');
                let html = '';
                let unreadCount = 0;

                allNotifs.forEach(notif => {
                    const isRead = readNotifs.includes(notif.id);
                    if (!isRead) unreadCount++;

                    const dateObj = notif.date ? new Date(notif.date) : null;
                    const dateStr = dateObj ? dateObj.toLocaleDateString('ar-EG') : '';
                    const timeStr = dateObj ? dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';

                    html += `
                        <div class="notif-item ${!isRead ? 'unread' : ''}" onclick="handleNotificationClick('${notif.id}', '${notif.link}', '${student.student_id}')">
                            <p>${notif.title}</p>
                            <span class="subtitle">${notif.subtitle}</span>
                            <span class="time">🕒 ${dateStr} - ${timeStr}</span>
                        </div>
                    `;
                });

                notifList.innerHTML = html;
                if (unreadCount > 0) {
                    badge.innerText = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            });
        }

        window.markAllAsRead = function(e) {
            e.stopPropagation();
            let readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + currentStudent.student_id) || '[]');
            allNotifsCache.forEach(n => {
                if(!readNotifs.includes(n.id)) readNotifs.push(n.id);
            });
            localStorage.setItem('readNotifications_' + currentStudent.student_id, JSON.stringify(readNotifs));
            fetchNotifications(currentStudent);
        }

        // التعامل مع الضغط على الإشعار وتوجيهه لتسجيل الحضور لو المحاضرة بدأت
        window.handleNotificationClick = function(notifId, link, studentId) {
            let readNotifs = JSON.parse(localStorage.getItem('readNotifications_' + studentId) || '[]');
            if (!readNotifs.includes(notifId)) {
                readNotifs.push(notifId);
                localStorage.setItem('readNotifications_' + studentId, JSON.stringify(readNotifs));
            }
            
            if (link === 'attendance_action') {
                openAttendanceModal();
            } else if (link && link !== '#') {
                location.href = link;
            }
        }

        window.openMaterialDetails = function(materialTitle) {
            location.href = `material.html?title=${encodeURIComponent(materialTitle)}`;
        }
    </script>
</body>
