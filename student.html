<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - بوابة الطالب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        /* الهيدر الاحترافي الفخم */
        header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .logo-area span {
            color: #3b82f6;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        /* إيقونة الجرس والإشعارات */
        .notification-container {
            position: relative;
        }
        .bell-btn {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #475569;
            transition: background 0.2s;
            position: relative;
        }
        .bell-btn:hover { background: #e2e8f0; }
        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .notifications-dropdown {
            position: absolute;
            left: 0;
            top: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            z-index: 1100;
            border: 1px solid #f1f5f9;
        }
        .notifications-dropdown.show { display: flex; }
        .notif-header {
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            background: #f8fafc;
        }
        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            color: #334155;
            transition: background 0.2s;
        }
        .notif-item:hover { background: #f8fafc; }
        .notif-item p { margin-bottom: 3px; font-weight: 600; }
        .notif-item span { font-size: 11px; color: #94a3b8; }

        /* بروفايل المستخدم والقائمة */
        .user-menu-container {
            position: relative;
            cursor: pointer;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        .dropdown-menu {
            position: absolute;
            left: 0;
            top: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu a {
            padding: 12px 18px;
            text-decoration: none;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .dropdown-menu a:hover { background: #f8fafc; }
        .dropdown-menu a.logout {
            color: #ef4444;
            border-top: 1px solid #f1f5f9;
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 100%, #1d4ed8 0%);
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
            position: relative;
            overflow: hidden;
        }
        .welcome-banner h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .welcome-banner p {
            font-size: 15px;
            opacity: 0.9;
        }

        /* خريطة المواد */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .material-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }
        .material-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: #3b82f6;
        }
        .material-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }
        .material-card h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .material-card p {
            font-size: 13px;
            color: #64748b;
        }

        /* Toast Messages */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #ef4444; }
        .toast.warning { background-color: #f59e0b; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- الهيدر الاحترافي -->
    <header>
        <div class="logo-area">
            جامعة <span>حلوان</span>
        </div>
        <div class="header-right">
            <!-- أيقونة الإشعارات المتطورة -->
            <div class="notification-container">
                <button class="bell-btn" onclick="toggleNotifications()">
                    🔔
                    <span class="badge" id="notifBadge" style="display: none;">0</span>
                </button>
                <div class="notifications-dropdown" id="notifDropdown">
                    <div class="notif-header">الإشعارات الجديدة</div>
                    <div id="notifList">
                        <div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">لا توجد إشعارات جديدة</div>
                    </div>
                </div>
            </div>

            <!-- بروفايل المستخدم -->
            <div class="user-menu-container" onclick="toggleUserDropdown()">
                <div class="user-profile">
                    <span id="studentNameDisplay">جاري التحميل...</span> ▾
                </div>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="settings.html">إعدادات الحساب</a>
                    <a href="#" class="logout" onclick="logout()">تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <div class="container">
        <div class="welcome-banner">
            <h1 id="welcomeTitle">أهلاً بك يا طالب</h1>
            <p id="academicYearDisplay">الفرقة الدراسية: جاري التحميل...</p>
        </div>

        <div class="section-title">📚 خريطة المواد الدراسية</div>
        <div class="materials-grid" id="materialsGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background: white; border-radius: 14px; border: 1px solid #e2e8f0;">
                جاري تحميل المواد المخصصة لفرقتك الدراسية...
            </div>
        </div>
    </div>

    <!-- فايربيس والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        window.toggleUserDropdown = function() {
            document.getElementById('userDropdown').classList.toggle('show');
            document.getElementById('notifDropdown').classList.remove('show');
        }

        window.toggleNotifications = function() {
            document.getElementById('notifDropdown').classList.toggle('show');
            document.getElementById('userDropdown').classList.remove('show');
        }

        window.logout = function() {
            localStorage.removeItem('currentStudent');
            location.href = 'index.html';
        }

        const studentDataStr = localStorage.getItem('currentStudent');
        if (!studentDataStr) {
            location.href = 'index.html';
        } else {
            const student = JSON.parse(studentDataStr);
            document.getElementById('studentNameDisplay').innerText = student.fullName;
            document.getElementById('welcomeTitle').innerText = 'أهلاً بك، ' + student.fullName;
            document.getElementById('academicYearDisplay').innerText = 'الفرقة الدراسية: الفرقة ' + student.academicYear;

            fetchMaterials(student.academicYear);
            fetchNotifications(student.academicYear);
        }

        // جلب المواد الدراسية الخاصة بفرقة الطالب
        async function fetchMaterials(year) {
            const grid = document.getElementById('materialsGrid');
            try {
                const q = query(collection(db, "materials"), where("academicYear", "==", year));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; background:white; border-radius:14px; border: 1px solid #e2e8f0;">لا توجد مواد منشورة لهذه الفرقة حتى الآن.</div>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const material = docSnap.data();
                    html += `
                        <div class="material-card" onclick="openMaterialDetails('${material.title}')">
                            <h3>📚 ${material.title}</h3>
                            <p>انقر لعرض كتب المادة والامتحانات السابقة</p>
                        </div>
                    `;
                });
                grid.innerHTML = html;

            } catch (error) {
                console.error("Error fetching materials: ", error);
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: red; padding: 40px;">حدث خطأ أثناء تحميل المواد الدراسية.</div>`;
            }
        }

        // جلب الإشعارات التلقائية عند نشر أي بيانات تخص سنة الطالب
        async function fetchNotifications(year) {
            const notifList = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            try {
                const q = query(collection(db, "materialContents"), where("academicYear", "==", year));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    notifList.innerHTML = `<div style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">لا توجد إشعارات جديدة</div>`;
                    badge.style.display = 'none';
                    return;
                }

                let html = '';
                let count = 0;
                querySnapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG') : 'حديثاً';
                    const typeText = item.type === 'book' ? 'كتاب دراسي جديد' : 'امتحان سابق جديد';
                    
                    html += `
                        <div class="notif-item">
                            <p>تم نشر ${typeText}: ${item.title}</p>
                            <span>بواسطة: ${item.publisherName || 'الإدارة'} | ${dateFormatted}</span>
                        </div>
                    `;
                    count++;
                });

                notifList.innerHTML = html;
                badge.innerText = count;
                badge.style.display = 'flex';

            } catch (error) {
                console.error("Error fetching notifications:", error);
            }
        }

        window.openMaterialDetails = function(materialTitle) {
            location.href = `material.html?title=${encodeURIComponent(materialTitle)}`;
        }
    </script>

</body>
</html>
