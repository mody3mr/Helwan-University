<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة حلوان - لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f4f6f9;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 22px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 18px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        table th, table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; margin-right: 5px; }
        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        /* نظام الـ Toast Messages */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #2ecc71; }
        .toast.error { background-color: #e74c3c; }
        .toast.warning { background-color: #f39c12; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="container">
        <header>
            <h1>لوحة تحكم الإدارة - جامعة حلوان</h1>
            <button class="btn btn-reject" onclick="location.href='index.html'">تسجيل الخروج</button>
        </header>

        <div class="card">
            <h2>طلبات إنشاء الحساب المعلقة (Pending Students)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الرقم التعريفي (ID)</th>
                            <th>الاسم الرباعي</th>
                            <th>البريد الإلكتروني</th>
                            <th>رقم الهاتف</th>
                            <th>الفرقة</th>
                            <th>رقم البطاقة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="pendingRequestsTable">
                        <tr>
                            <td colspan="7" class="no-data">جاري تحميل الطلبات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ربط فايربيس والمنطق البرمجي للداش بورد -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4tMfI31ULU4gceJbA1LakSyoCIHKanQ0",
            authDomain: "helwan-university-3cfd3.firebaseapp.com",
            projectId: "helwan-university-3cfd3",
            storageBucket: "helwan-university-3cfd3.firebasestorage.app",
            messagingSenderId: "649399927965",
            appId: "1:649399927965:web:87f52cb4eff211595fc074"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // جلب الطلبات المعلقة وعرضها في الجدول
        async function fetchPendingRequests() {
            const tbody = document.getElementById('pendingRequestsTable');
            try {
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" class="no-data">لا توجد طلبات معلقة حالياً.</td></tr>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((documentSnapshot) => {
                    const user = documentSnapshot.data();
                    const docId = documentSnapshot.id;

                    html += `
                        <tr>
                            <td><b>${user.student_id || 'غير متوفر'}</b></td>
                            <td>${user.fullName}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td>الفرقة ${user.academicYear}</td>
                            <td>${user.nationalId}</td>
                            <td>
                                <button class="btn btn-approve" onclick="updateStudentStatus('${docId}', 'approved')">موافقة</button>
                                <button class="btn btn-reject" onclick="updateStudentStatus('${docId}', 'rejected')">رفض</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (error) {
                console.error("Error fetching pending requests: ", error);
                tbody.innerHTML = `<tr><td colspan="7" class="no-data" style="color:red;">حدث خطأ أثناء جلب البيانات.</td></tr>`;
            }
        }

        // تحديث حالة الطالب (موافقة أو رفض)
        window.updateStudentStatus = async function(docId, newStatus) {
            try {
                const studentDocRef = doc(db, "users", docId);
                await updateDoc(studentDocRef, {
                    status: newStatus
                });

                if(newStatus === 'approved') {
                    showToast('تمت الموافقة على الطالب بنجاح!', 'success');
                } else {
                    showToast('تم رفض الطلب بنجاح.', 'warning');
                }

                // تحديث القائمة تلقائياً
                fetchPendingRequests();

            } catch (error) {
                console.error("Error updating status: ", error);
                showToast('حدث خطأ أثناء تحديث الحالة.', 'error');
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        fetchPendingRequests();
    </script>

</body>
</html>
